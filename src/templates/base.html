<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
{% if description %}
  <meta name="description" content="{{ description }}">
{% endif %}
  <link rel="icon" href="{{ root }}static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
  <link rel="stylesheet" href="{{ root }}static/style.css">
  <script>
    try { if (localStorage.getItem("layout") === "wide") document.documentElement.classList.add("wide"); } catch (e) {}
    try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
  <script src="{{ root }}static/layout.js" defer></script>
  <script src="{{ root }}static/theme.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap wrap-wide">
      <a class="logo" href="{{ root }}">bogomaz-robotic<span>.</span>tech</a>
      <div class="header-tools">
        <button class="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme" hidden>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
        <button class="width-toggle" type="button" aria-pressed="false" aria-label="Full width" title="Full width" hidden>
          <svg class="icon-wide" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M3 5v14M21 5v14M7 12h10M10 9l-3 3 3 3M14 9l3 3-3 3" />
          </svg>
          <svg class="icon-narrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M12 5v14M3 12h6M15 12h6M6 9l3 3-3 3M18 9l-3 3 3 3" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="{% block main_class %}wrap{% endblock %}">
{% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap wrap-wide">
      <a href="https://github.com/bogomaz-robotic/fantastic-garbanzo">GitHub</a>
    </div>
  </footer>
{% if mermaid %}

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    (function () {
      var blocks = document.querySelectorAll("pre.mermaid");
      var sources = [];
      for (var i = 0; i < blocks.length; i++) sources.push(blocks[i].textContent);

      function render() {
        var theme = document.documentElement.getAttribute("data-theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        for (var i = 0; i < blocks.length; i++) {
          blocks[i].removeAttribute("data-processed");
          blocks[i].textContent = sources[i];
        }
        mermaid.initialize({ startOnLoad: false, theme: theme === "dark" ? "dark" : "default" });
        mermaid.run({ nodes: blocks });
      }

      render();
      document.addEventListener("themechange", render);
    })();
  </script>
{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
